version: 2

models:
  - name: stg_gold__flights
    description: >
      Gold staging over silver_flights: the column subset gold consumes plus
      shared derived keys (route, scheduled-hour buckets), defined once. One
      row per flight leg including cancelled/diverted.
    columns:
      - name: flight_date
        tests: [not_null]
      - name: origin
        tests: [not_null]
      - name: dest
        tests: [not_null]
      - name: carrier
        tests: [not_null]

  - name: int_aircraft_rotation
    description: >
      LEAKAGE-CRITICAL shared model: per-leg aircraft-rotation attributes
      from SCHEDULE columns only (crs times, elapsed, distance, tail link) —
      the prior leg's ACTUAL outcomes are never selected. Chain links by UTC
      timestamps across midnight (red-eyes explicit); day position counts
      within the BTS service date. THE TAIL-SWAP RESTRICTION (adopted 2026-07
      after the gating experiment — see the model header): rotation features
      exist ONLY for schedule-consistent links; swap-shaped linkages
      (negative gap, station-continuity violation, overlapped prior, unknown
      tail, prior with unknown scheduled arrival — 4.12% of legs) carry NULL
      for every rotation column INCLUDING
      the band keys, and are excluded from the rates. A NULL band means
      "linkage not schedule-explained", never a silent default. One row per
      scheduled leg; the ML mart and int_historical_delay_rates both ref()
      this — the definition lives once.
      Value-level pin: assert_ml_rotation_schedule_only.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - flight_date
              - carrier
              - flight_number
              - origin
              - dest
              - crs_dep_time
    columns:
      - name: turnaround_band
        tests:
          - accepted_values:
              arguments:
                values: ['no_inbound', 'lt_35', '35_60', '60_120', 'ge_120']
      - name: rotation_position_key
        tests:
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5', '6']
      - name: sched_turnaround_min
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 840

  - name: int_historical_delay_rates
    description: >
      LEAKAGE-CRITICAL shared model: historical delay rates by route, carrier,
      origin airport, scheduled-turnaround band and rotation position (the
      last two = the leak-free substitute for actual inbound delay), computed
      exclusively on flights strictly before
      var('train_test_cutoff_date') (see dbt_project.yml — the single place
      the boundary lives). Both the analytics marts and the ML feature mart
      ref() this; nothing recomputes these rates. The ML mart consumes them
      smoothed toward the training-window global (prior strength
      var('hist_smoothing_prior_strength') — the definition still lives
      once). Entities first seen in the test window are absent by design —
      consumers keep the NULL. The airport level is ORIGIN-grain (flights
      departing).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [entity_level, entity_key]
    columns:
      - name: entity_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['route', 'carrier', 'airport', 'turnaround_band', 'rotation_position']
      - name: entity_key
        tests: [not_null]
      - name: n_flights
        tests: [not_null]
      - name: arr_del15_rate
        description: Share of completed pre-cutoff flights arriving >= 15 min late.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
